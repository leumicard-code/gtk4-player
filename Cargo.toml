[package]
name = "gtkplayer"
version = "10.0.0"
edition = "2021"
authors = ["Shay Kadosh"]
description = "GTK 4 Audiophile Music Player with 10-Band GStreamer Equalizer & 64-Band RTA Spectrum Studio"

[dependencies]
gtk = { version = "0.9", package = "gtk4", features = ["v4_12"] }
gstreamer = "0.22"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5"
walkdir = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
